name: Release

# Auto-publish on merge to master, driven by changeset files in .changes/.
# No changeset present -> the `release` job is skipped -> nothing is published.
# The release commit/tag is pushed with the default GITHUB_TOKEN, which does NOT
# re-trigger workflows, so there is no publish loop.
on:
  push:
    branches: [master]

# Serialize releases; never cancel a half-finished publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.status.outputs.has }}
      bump: ${{ steps.status.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: status
        run: node scripts/changesets.mjs status --github-output

  release:
    needs: detect
    # TWO conditions, not one.
    #
    # `has` is the changeset gate. `vars.PUBLISH_ENABLED` is a kill switch for the fork: this repo
    # renamed the package to cc-fleet, but the npm identity for that name is not set up yet (see
    # CLAUDE.md). Without the switch, the first merge carrying a changeset would either claim the
    # name on npm with whatever NPM_TOKEN happens to be configured — a 72-hour unpublish window is
    # the only way back — or fail CI at the publish step.
    #
    # Gating the whole JOB, not just the publish step, is deliberate: a skipped publish inside a
    # running job would still bump the version and consume the changesets, leaving master claiming a
    # release that never reached npm. With the switch off, pending changesets simply stay pending.
    #
    # To enable: set repository variable PUBLISH_ENABLED=true (Settings → Secrets and variables →
    # Actions → Variables) once the npm identity and NPM_TOKEN are in place.
    if: ${{ needs.detect.outputs.has == 'true' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag back to master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true # keep GITHUB_TOKEN for the push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bump version (no tag yet)
        id: bump
        run: |
          NEW=$(npm version "${{ needs.detect.outputs.bump }}" --no-git-tag-version)
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW"

      # CHANGELOG must be updated BEFORE the build: gen-changes.mjs (prebuild) materializes the top
      # entries into src/changes.ts, so the just-released version only lands in /changes if its
      # CHANGELOG entry already exists. Consuming the spent changesets is deferred until after publish.
      - name: Update CHANGELOG (before build, so changes.ts includes this release)
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          BODIES=$(node scripts/changesets.mjs bodies)
          {
            echo "## v$VERSION — $DATE"
            echo ""
            echo "$BODIES"
            echo ""
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > CHANGELOG.next.md
          mv CHANGELOG.next.md CHANGELOG.md

      - name: Regenerate generated sources
        run: |
          node scripts/gen-version.mjs
          node scripts/gen-changes.mjs

      - name: Build + test (gate before publish)
        run: |
          npm run build
          npm test

      # Idempotent: if this version is already on npm (e.g. a prior run published but
      # failed to push), skip publish so a re-run can still land the commit/tag.
      #
      # The package name is READ FROM package.json rather than hardcoded. It used to be a literal
      # "copilot-reverse", which the fork's rename silently turned into a check against a different
      # package — so the guard could never match and every run went straight to `npm publish`,
      # defeating the idempotency it exists to provide.
      - name: Publish to npm (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Consume changesets (after publish)
        run: node scripts/changesets.mjs consume

      - name: Commit, tag, push (with rebase retry)
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          # Stage every release-generated file. src/changes.ts is regenerated by the
          # "Regenerate generated sources" step above (prebuild -> gen-changes); if it is left
          # unstaged the later `git pull --rebase` aborts with "unstaged changes" and the push
          # never lands — the worker publishes to npm but master/tags silently desync.
          git add package.json package-lock.json src/version.ts src/changes.ts CHANGELOG.md
          git add -A .changes
          git commit -m "release: v$VERSION"
          git tag "v$VERSION"
          for i in 1 2 3; do
            # --autostash so any other stray generated file can't wedge the rebase either.
            git pull --rebase --autostash origin master \
              && git push origin HEAD:master \
              && git push origin "v$VERSION" \
              && exit 0
            echo "push attempt $i failed; retrying after rebase…"
            sleep 3
          done
          echo "::error::failed to push release after 3 attempts"
          exit 1
